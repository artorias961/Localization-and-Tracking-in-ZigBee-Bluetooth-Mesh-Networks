



CONFIG_NCS_SAMPLES_DEFAULTS=n

CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_GPIO=y

# Make sure printk is not printing to the UART console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_THREAD_PRIORITY=7

# CONFIG_ZIGBEE=y
# CONFIG_ZIGBEE_APP_UTILS=y
# CONFIG_ZIGBEE_ROLE_COORDINATOR=y 

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

# This example requires more workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Enable nRF ECB driver
# CONFIG_CRYPTO=y
# CONFIG_CRYPTO_NRF_ECB=y
# CONFIG_CRYPTO_INIT_PRIORITY=80

# # Networking
# CONFIG_NET_IPV6=n
# CONFIG_NET_IP_ADDR_CHECK=n
# CONFIG_NET_UDP=n

# IM ADDING EVERYTHING UNDERNEATH!!!

# Enable Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Arty_Chan"

# Enable mutlple BT API dataset
CONFIG_BT_EXT_ADV=y

# Enable Bluetooth RSSI measurement feature 
# CONFIG_DM_MODULE=y          # might delete, <mpsl_timeslot.h>
# CONFIG_DM_MODULE_RPC=y      # might delete, <mpsl_timeslot.h>
# CONFIG_DM_MODULE_RPC_HOST=y # might delete, <mpsl_timeslot.h>
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_CONN_RSSI=y

# Enable callbacks
CONFIG_BT_HCI_VS_EVT_USER=y

# Destination Estimation Algorithms
CONFIG_DM_HIGH_PRECISION_CALC=y

# Enable Single and Mulit protocol
# CONFIG_MPSL=y  # conflict with DM MODULE


# Enabled Float Point Unit
CONFIG_FPU=y

# Enable hardware bus
# CONFIG_I2C=y

# Enable Log Module and Printk
CONFIG_LOG=y
CONFIG_PRINTK=y



